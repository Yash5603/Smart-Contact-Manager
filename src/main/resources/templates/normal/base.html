<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:fragment="layout(content)">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${title}">Base</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
	integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />

<link rel="stylesheet" th:href="@{/css/mycss.css}">

</head>
<body>
	<nav
		class="navbar navbar-expand-lg bg-body-tertiary navbar-dark bg-primary">
		<div class="container-fluid">
			<a class="navbar-brand" th:href="@{/}">SmartContactManager</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0 text-uppercase">
					<li class="nav-item"><a class="nav-link active"
						aria-current="page" th:href="@{/users/index}">Home</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
					<li class="nav-item"><a class="nav-link"
						th:href="@{/users/index}"><span th:text="${user.name}"></span></a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
				</ul>
			</div>
		</div>
	</nav>
	<!-- End Navbar -->


	<!-- Start Sidebar -->
	<div class="sidebar">
		<span onclick="toggleSidebar()" class="crossBtn">&times;</span>

		<!-- a.item*5 Tab Press-->
		<a href="" th:href="@{/users/index}" class="item"><i class="fa-solid fa-house"></i> Home</a> 
		<a href="" th:href="@{/users/show-contacts/0}" class="item"><i class="fa-solid fa-address-book"></i> View Contacts</a> 
		<a href="" th:href="@{/users/add-contact}" class="item"><i class="fa-solid fa-user-plus"></i> Add Contact</a>
		<a href="" class="item"><i class="fa-solid fa-circle-user"></i> Your Profile</a> 
		<a href="" class="item"><i class="fa-solid fa-gear"></i> Settings</a>
		<a href="" class="item"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
	</div>
	
	<!-- Content -->
	<div class="content mt-5">
		<i onclick="toggleSidebar()" class="fa-solid fa-bars"></i>
		<div th:if="${session.message}" class="container">
			<div th:classappend="${session.message.type}" class="alert text-center" role="alert">
			<span th:text="${session.message.content}"></span>
			</div>
			<th:block th:text="${@sessionHelper.removeMessageFromSession()}"></th:block>
		</div>
		<div th:replace="${content}"></div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
		
	<script th:src="@{/js/scripts.js}"></script>
	
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</body>
</html>
