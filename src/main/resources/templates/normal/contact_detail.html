<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{normal/base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title></title>
<body>
	<section>
		<div class="card" th:if="${contact}">
			<div class="card_body">
				<div class="container text-center">
					<img alt="" src="" style="width: 200px; height: 200px"
						th:src="@{'/images/'+${contact.image}}">
					<h3 th:text="${contact.name +' '+contact.secondName}"></h3>

					<table class="table">
						<tbody>
							<tr>
								<th>#ID</th>
								<td>SCMUSER<span th:text="${contact.CId}"></span></td>
							</tr>

							<tr>
								<th>EMAIL</th>
								<td><span th:text="${contact.email}"></span></td>
							</tr>

							<tr>
								<th>PHONE</th>
								<td><span th:text="${contact.phone}"></span></td>
							</tr>

							<tr>
								<th>WORK</th>
								<td><span th:text="${contact.work}"></span></td>
							</tr>
						</tbody>
					</table>

					<div class="description">
						<th:block th:utext="${contact.description}"></th:block>
					</div> <!-- utext converts the html code into text -->

					<div class="container">
						<button class="btn btn-primary btn-block">Update</button>
						<button class="btn btn-danger btn-block">Delete</button>
					</div>

				</div>
			</div>
		</div>
		
		<h2 class="text-center p-3 bg-danger text-white" th:unless="${contact}">You Don't Have Permission
			To See This Contact!!!</h2>
	</section>
</body>
</html>
