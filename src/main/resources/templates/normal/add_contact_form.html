<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{normal/base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title></title>
<body>
	<section>
		<div class="card mr-3 ml-3">
			<div class="card-body">
				<h1 class="text-center">Add Contact</h1>
					<div class="container-fluid mt-1">
						<div class="row">
							<div class="col-md-10 offset-md-1">
								<form th:object="${contact}" enctype="multipart/form-data" method="post"
								      th:action="@{/users/process-contact}" class="mt-2">
									
									<!-- First Name -->
									<div class="input-group has-validation">
										<span class="input-group-text" id="inputGroupPrepend">
										<i class="fa-regular fa-user"></i></span>
										<input type="text" name="name" th:value="${contact.name}" class="form-control" id="validationCustomUsername" placeholder="Enter First Name"
										describedby="inputGroupPrepend" required>
									</div>
									
									<!-- Second Name -->
									<div class="input-group has-validation">
										<span class="input-group-text" id="inputGroupPrepend">
										<i class="fa-regular fa-user"></i></span>
										<input type="text" name="secondName" th:value="${contact.secondName}" class="form-control" id="validationCustomUsername" placeholder="Enter Second Name"
										describedby="inputGroupPrepend" required>
									</div>
									
									<!-- Phone -->
									<div class="input-group has-validation">
										<span class="input-group-text" id="inputGroupPrepend">
										<i class="fa-solid fa-phone"></i></span>
										<input type="text" name="phone" th:value="${contact.phone}" class="form-control" id="validationCustomUsername" placeholder="Enter Phone No."
										describedby="inputGroupPrepend" required>
									</div>
									
									<!-- Email -->
									<div class="input-group has-validation">
										<span class="input-group-text" id="inputGroupPrepend">
										<i class="fa-solid fa-envelope"></i></span>
										<input type="email" name="email" th:value="${contact.email}" class="form-control" id="validationCustomUsername" placeholder="Enter Email Id"
										describedby="inputGroupPrepend" required>
									</div>
									
									<!-- Work -->
									<div class="input-group has-validation">
										<span class="input-group-text" id="inputGroupPrepend">
										<i class="fa-solid fa-briefcase"></i></span>
										<input type="text" name="work" th:value="${contact.work}" class="form-control" id="validationCustomUsername" placeholder="Enter Work Here"
										describedby="inputGroupPrepend" required>
									</div>
									
									<!-- About -->
									<div class="input-group">
										<textarea class="form-control" id="exampleFormControlTextarea1" rows="10" placeholder="Enter Contact Description"
										name="description" th:value="${contact.description}"></textarea>
									</div>
									
									<!-- Image -->
									<div class="custom-file">
										<input type="file" name="profileImage"/>
									</div>
									
									<!-- Save Button -->
									<div class="container text-center">
										<button class="btn btn-outline-primary">Save Contact</button>
									</div>
								</form>
							</div>
						</div>
					</div>
			</div>
		</div>
	</section>
</body>
</html>
