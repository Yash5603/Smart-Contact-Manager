<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">
</head>
<body>
	<section>
		<div class="container">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<div class="my-card">
						<div th:if="${session.message}" class="alert"
							th:classappend="${session.message.type}" role="alert">
							<p class="text-center" th:text="${session.message.content}"></p>
						</div>
						<div class="container text-center">
							<img width="80px" th:src="@{/images/SignUpLogo.png}">
						</div>
						<h1 class="text-center">Register Here</h1>
						<form action="" th:action="@{/do_register/save}" method="post"
							th:object="${user}">

							<!-- Name Field -->
							<div class="mb-1">
								<label for="exampleInputName" class="form-label">Your
									Name</label> <input type="text" class="form-control" id="name_field"
									aria-describedby="emailHelp" name="name"
									th:value="${user.name}"
									th:classappend="${#fields.hasErrors('name')?'is-invalid':''}">

								<p id="validationServer03Feedback"
									th:each="e : ${#fields.errors('name')}" th:text="${e}"
									class="invalid-feedback"></p>
							</div>

							<!-- Email Field -->
							<div class="mb-1">
								<label for="exampleInputEmail1" class="form-label">Email
									address</label> <input type="email" class="form-control"
									id="email_field" aria-describedby="emailHelp" name="email"
									th:value="${user.email}"
									th:classappend="${#fields.hasErrors('email')?'is-invalid':''}">

								<p id="validationServer03Feedback"
									th:each="e : ${#fields.errors('email')}" th:text="${e}"
									class="invalid-feedback"></p>
							</div>

							<!-- Password Field -->
							<div class="mb-3">
								<label for="exampleInputPassword1" class="form-label">Password</label>
								<input type="password" class="form-control" id="password_field"
									name="password" th:value="${user.password}"
									th:classappend="${#fields.hasErrors('password')?'is-invalid':''}">

								<p id="validationServer03Feedback"
									th:each="e : ${#fields.errors('password')}" th:text="${e}"
									class="invalid-feedback"></p>
							</div>

							<!-- About Field -->
							<div class="mb-3">
								<textarea class="form-control" id="exampleFormControlTextarea1"
									rows="5" placeholder="Something about Yourself!" name="about"
									th:value="${user.about}"></textarea>
							</div>

							<!-- Terms & Conditions -->
							<div class="form-check">
								<input name="agreement" class="form-check-input" type="checkbox"
									id="invalidCheck"> <label class="form-check-label"
									for="invalidCheck"> Agree to Terms & Conditions. </label>
								<div class="invalid-feedback">You must Agree before
									Submitting!</div>
							</div>

							<!-- Buttons -->
							<div>
								<button style="background-color: #009688" type="submit"
									class="btn btn-primary btn-block text-white mt-3">Submit</button>
								<button type="reset"
									class="btn btn-warning btn-block text-white mt-3">Reset</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>
</html>
